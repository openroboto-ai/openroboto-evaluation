[project]
name = "validator"
version = "0.1.0"
description = "Modular LIBERO, LIBERO-Pro, and RoboTwin evaluation for multiple VLA backbones"
requires-python = ">=3.11"
dependencies = [
    # The orchestrator itself is lightweight (HF downloads + YAML contract checks).
    # The heavyweight environments (openpi policy server, Python 3.8 LIBERO
    # client) are separate venvs inside third_party/openpi, built by setup.sh —
    # they cannot share one interpreter with this project.
    "huggingface_hub>=0.30",
    "pyyaml>=6.0",
    "zstandard>=0.23",
]

[dependency-groups]
dev = [
    "numpy>=1.26",
    "pillow>=11",
    "pytest>=8.0",
]

[tool.uv]
# Plain scripts (libero_eval/run_eval.py), nothing to build or install.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
format.preview = true
lint.preview = false
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "UP",   # pyupgrade
    "NPY",  # numpy-specific rules
]
lint.ignore = [
    "E266",  # allow multiple leading # in comments
    "E402",  # allow imports not at the top of the file
    "E722",  # allow bare except
    "F403",  # allow `from module import *`
    "NPY002",  # allow legacy `numpy.random` functions
]
target-version = "py38"
extend-exclude = [
    "third_party",
    # Source snapshots are verified byte-for-byte against SOURCES.json.
    "libero_eval/axis_components",
]
